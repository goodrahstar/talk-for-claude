<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk player</title>
<style>
  :root { --bg:#FAF9F5; --fg:#141413; --muted:#6B6A64; --line:#E3E1D8; --accent:#D97757; --card:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141413; --fg:#F0EEE6; --muted:#A8A69D; --line:#3D3D3A; --accent:#D97757; --card:#1F1F1D; } }
  :root[data-theme="dark"] { --bg:#141413; --fg:#F0EEE6; --muted:#A8A69D; --line:#3D3D3A; --accent:#D97757; --card:#1F1F1D; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--fg); padding:10px 18px; cursor:pointer; }
  button.play { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:12px 26px; font-size:17px; }
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); max-width:100%; }
  #status { color:var(--muted); font-size:14px; margin-top:12px; min-height:21px; }
  details { margin-top:16px; }
  summary { cursor:pointer; color:var(--muted); font-size:14px; }
  #text { white-space:pre-wrap; margin-top:8px; }
  h1 { font-size:20px; margin:0 0 14px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Listen to Claude's reply</h1>
    <div class="row">
      <button class="play" id="play">Play</button>
      <button id="stop" disabled>Stop</button>
      <select id="mode" aria-label="Voice">
        <option value="kokoro">Natural voice (Kokoro-82M, runs in your browser)</option>
        <option value="system">Built-in device voice (instant)</option>
      </select>
    </div>
    <div id="status" role="status">Press Play. The natural voice downloads once (about 90 MB), then plays offline.</div>
    <details><summary>Show the spoken text</summary><div id="text"></div></details>
  </div>
</main>
<script id="talk-text" type="application/json">"__TALK_TEXT__"</script>
<script type="module">
const TEXT = JSON.parse(document.getElementById("talk-text").textContent);
const $ = (id) => document.getElementById(id);
const log = (m) => { (window.__talkLog ||= []).push(m); console.log("[talk] " + m); };
$("text").textContent = TEXT;
const status = (m) => { $("status").textContent = m; };
let stopped = false, current = null, tts = null, ctx = null;

const sentences = (t) => (t.match(/[^.!?\n]+[.!?]*\s*/g) || [t]).map((s) => s.trim()).filter(Boolean);

function bestSystemVoice() {
  const vs = speechSynthesis.getVoices().filter((v) => /^en(-|_|$)/i.test(v.lang));
  const rank = (v) => (/(premium|enhanced|natural|neural)/i.test(v.name) ? 3 : 0) + (/google us english|samantha|ava|zoe/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
  return vs.sort((a, b) => rank(b) - rank(a))[0] || null;
}

async function speakSystem() {
  if (!("speechSynthesis" in window)) throw new Error("no speech synthesis in this browser");
  if (!speechSynthesis.getVoices().length) await new Promise((r) => { speechSynthesis.onvoiceschanged = r; setTimeout(r, 1500); });
  const voice = bestSystemVoice();
  status(`Speaking with ${voice ? voice.name : "the default voice"}.`);
  log(`system voice: ${voice ? voice.name : "default"}`);
  for (const s of sentences(TEXT)) {
    if (stopped) return;
    await new Promise((res, rej) => {
      const u = new SpeechSynthesisUtterance(s);
      if (voice) u.voice = voice;
      u.rate = 1.02;
      u.onstart = () => log("system start");
      u.onend = res;
      u.onerror = (e) => (e.error === "interrupted" || e.error === "canceled" ? res() : rej(new Error(e.error)));
      speechSynthesis.speak(u);
    });
  }
}

async function speakKokoro() {
  if (!tts) {
    status("Loading the natural voice (once, about 90 MB)...");
    const { KokoroTTS } = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm");
    tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", {
      dtype: "q8", device: "wasm",
      progress_callback: (p) => { if (p.status === "progress" && p.total) status(`Loading the natural voice... ${Math.round((p.loaded / p.total) * 100)}%`); },
    });
    log("kokoro loaded");
  }
  status("Speaking with Kokoro-82M.");
  const parts = sentences(TEXT);
  let next = tts.generate(parts[0], { voice: "af_heart" });
  for (let i = 0; i < parts.length; i++) {
    if (stopped) return;
    const audio = await next;
    if (i + 1 < parts.length) next = tts.generate(parts[i + 1], { voice: "af_heart" }); // synthesize ahead while playing
    if (stopped) return;
    // Web Audio, unlocked during the click, so playback is allowed even after the async model load.
    const buf = ctx.createBuffer(1, audio.audio.length, audio.sampling_rate);
    buf.copyToChannel(audio.audio, 0);
    await new Promise((res) => {
      current = ctx.createBufferSource();
      current.buffer = buf;
      current.connect(ctx.destination);
      current.onended = res;
      current.start();
      log(`kokoro chunk ${i + 1}/${parts.length} playing (${(audio.audio.length / audio.sampling_rate).toFixed(1)}s, ctx ${ctx.state})`);
    });
  }
}

$("play").onclick = async () => {
  stopped = false;
  ctx ||= new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  $("play").disabled = true; $("stop").disabled = false;
  try {
    if ($("mode").value === "kokoro") {
      try { await speakKokoro(); }
      catch (e) {
        log(`kokoro failed: ${e.message}`);
        status("The natural voice could not load here, using your device voice instead.");
        $("mode").value = "system";
        await speakSystem();
      }
    } else {
      await speakSystem();
    }
    if (!stopped) { status("Done. Press Play to hear it again."); log("done"); }
  } catch (e) {
    status(`Could not speak: ${e.message}`); log(`error: ${e.message}`);
  } finally {
    $("play").disabled = false; $("stop").disabled = true;
  }
};
$("stop").onclick = () => {
  stopped = true;
  speechSynthesis.cancel();
  if (current) { try { current.stop(); } catch {} }
  status("Stopped.");
};
</script>
</body>
</html>
